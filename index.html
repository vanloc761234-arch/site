<!DOCTYPE html> 
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GETKEY MENU FF</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#4b1111,#070707 65%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:#151515;
    border:1px solid #333;
    border-radius:20px;
    padding:30px 24px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,0,0,.18);
}

.logo{
    font-size:38px;
    font-weight:900;
    color:#ff3030;
    text-shadow:0 0 15px #ff0000;
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    font-size:14px;
    margin-bottom:25px;
}

.info{
    color:#aaa;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:11px;
    background:#ff3030;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff4b4b;
}

#keyBox{
    display:none;
    margin-top:20px;
    padding:20px;
    background:#090909;
    border:1px solid #333;
    border-radius:12px;
}

.keyTitle{
    color:#999;
    font-size:14px;
    margin-bottom:10px;
}

#key{
    color:#00ff88;
    font-size:22px;
    font-weight:bold;
    word-break:break-all;
}

.copy{
    margin-top:15px;
    background:#292929;
    font-size:14px;
}

.status{
    margin-top:15px;
    color:#888;
    font-size:13px;
}

.footer{
    margin-top:20px;
    color:#555;
    font-size:12px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        GETKEY MENU FF
    </div>

    <div class="subtitle">
        KEY MANAGEMENT
    </div>

    <div class="info">
        Nhấn nút bên dưới để nhận key.
        <br>
        Hoàn thành bước xác minh rồi quay lại trang.
    </div>

    <button onclick="goLink4M()">
        🔑 NHẬN KEY
    </button>

    <div id="status" class="status"></div>

    <div id="keyBox">

        <div class="keyTitle">
            KEY CỦA BẠN
        </div>

        <div id="key"></div>

        <button class="copy" onclick="copyKey()">
            📋 SAO CHÉP KEY
        </button>

    </div>

    <div class="footer">
        © 2026 GETKEY MENU FF
    </div>

</div>

<script>

/*
    LINK4M CỦA BẠN
*/
const LINK4M =
"https://link4m.org/MVYzDd";


/*
    Khi bấm NHẬN KEY
*/
function goLink4M(){

    /*
      Lưu trạng thái để khi quay lại
      trang có thể biết đã đi qua Link4M.
    */
    sessionStorage.setItem(
        "wentToLink4M",
        "1"
    );

    window.location.href = LINK4M;
}


/*
    Tạo key ngẫu nhiên
*/
function generateKey(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let part1 = "";
    let part2 = "";

    for(let i = 0; i < 6; i++){
        part1 += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];
    }

    for(let i = 0; i < 6; i++){
        part2 += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];
    }

    return "FF-" + part1 + "-" + part2;
}


/*
    Kiểm tra khi người dùng quay lại
*/
function checkReturn(){

    const went =
        sessionStorage.getItem(
            "wentToLink4M"
        );

    if(went === "1"){

        /*
          Xóa trạng thái để mã chỉ hiện
          một lần trong phiên trình duyệt.
        */
        sessionStorage.removeItem(
            "wentToLink4M"
        );

        const key =
            generateKey();

        document.getElementById(
            "key"
        ).textContent = key;

        document.getElementById(
            "keyBox"
        ).style.display = "block";

        document.getElementById(
            "status"
        ).textContent =
            "Đã quay lại. Key đã được tạo.";
    }
}


/*
    Copy key
*/
function copyKey(){

    const key =
        document.getElementById(
            "key"
        ).textContent;

    navigator.clipboard.writeText(key);

    document.getElementById(
        "status"
    ).textContent =
        "Đã sao chép key!";
}


checkReturn();

</script>

</body>
</html>
