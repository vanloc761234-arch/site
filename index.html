<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaxy Key</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#0b1220;
    color:white;
    padding:25px 15px;
}

.container{
    max-width:650px;
    margin:auto;
}

/* PROFILE */
.profile{
    text-align:center;
    margin:20px 0 35px;
}

.avatar{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:900;
    color:white;

    background:
      radial-gradient(circle at 30% 25%,#fff,#8c8cff 8%,transparent 18%),
      radial-gradient(circle at 70% 65%,#fff,#b000ff 8%,transparent 18%),
      radial-gradient(circle at 50% 50%,#211052,#090015 70%);

    border:3px solid #536bff;
    box-shadow:0 0 30px #4055ff;
}

.name{
    margin-top:15px;
    font-size:30px;
    font-weight:900;
}

.sub{
    margin-top:6px;
    color:#8994aa;
}

/* SEARCH */
.search{
    width:100%;
    padding:18px 20px;
    border-radius:18px;
    border:1px solid #35445c;
    background:#1b293b;
    color:white;
    font-size:17px;
    outline:none;
    margin-bottom:15px;
}

/* CATEGORY */
.category{
    width:100%;
    padding:18px 20px;
    border-radius:18px;
    background:#1b293b;
    border:1px solid #35445c;
    color:white;
    font-size:17px;
    margin-bottom:18px;
}

/* PRODUCTS */
.products{
    display:none;
}

.card{
    background:#1b293b;
    border:1px solid #35445c;
    border-radius:20px;
    padding:22px;
    margin-bottom:15px;
}

.card-top{
    display:flex;
    align-items:center;
    gap:18px;
}

.game-icon{
    width:75px;
    height:75px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#293b53;
    font-size:28px;
}

.card h2{
    font-size:22px;
}

.card p{
    color:#8994aa;
    margin-top:6px;
}

.get{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:0;
    border-radius:30px;
    background:#5064ff;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.result{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:12px;
    background:#101923;
    color:#62ff9b;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <div class="profile">

        <div class="avatar">
            G
        </div>

        <div class="name">
            galaxy.
        </div>

        <div class="sub">
            KEY MANAGEMENT
        </div>

    </div>


    <input
        class="search"
        placeholder="Tìm kiếm sản phẩm..."
        oninput="searchProduct(this.value)"
    >


    <div class="category">
        Tất cả games
    </div>


    <div class="products" id="products">

        <!-- SẢN PHẨM 1 -->
        <div class="card" data-name="Game Tool A">

            <div class="card-top">

                <div class="game-icon">
                    🎮
                </div>

                <div>
                    <h2>Game Tool A</h2>
                    <p>Key Access</p>
                </div>

            </div>

            <button class="get"
                onclick="showDemo(this,'DEMO-A')">
                Nhận key
            </button>

            <div class="result"></div>

        </div>


        <!-- SẢN PHẨM 2 -->
        <div class="card" data-name="Game Tool B">

            <div class="card-top">

                <div class="game-icon">
                    🎮
                </div>

                <div>
                    <h2>Game Tool B</h2>
                    <p>Key Access</p>
                </div>

            </div>

            <button class="get"
                onclick="showDemo(this,'DEMO-B')">
                Nhận key
            </button>

            <div class="result"></div>

        </div>


        <!-- SẢN PHẨM 3 -->
        <div class="card" data-name="Game Tool C">

            <div class="card-top">

                <div class="game-icon">
                    🎮
                </div>

                <div>
                    <h2>Game Tool C</h2>
                    <p>Key Access</p>
                </div>

            </div>

            <button class="get"
                onclick="showDemo(this,'DEMO-C')">
                Nhận key
            </button>

            <div class="result"></div>

        </div>

    </div>

</div>


<script>

/* Hiện danh sách */
document.getElementById("products").style.display="block";


/* Tìm sản phẩm */
function searchProduct(value){

    value=value.toLowerCase();

    document.querySelectorAll(".card").forEach(card=>{

        const name=
            card.dataset.name.toLowerCase();

        card.style.display=
            name.includes(value)
            ? "block"
            : "none";

    });
}


/* Demo mã cho dự án hợp lệ */
function showDemo(button,key){

    const result=
        button.parentElement.querySelector(".result");

    result.style.display="block";

    result.textContent=
        "Mã demo: "+key;
}

</script>

</body>
    </html>
