<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>galaxy. | Key MenuGame</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#0b1322;
    color:white;
    padding:25px 15px 50px;
}

.container{
    max-width:650px;
    margin:auto;
}

/* PROFILE */
.profile{
    text-align:center;
    padding:25px 0 35px;
}

.avatar{
    width:105px;
    height:105px;
    margin:auto;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;
    font-weight:900;

    background:
        radial-gradient(circle at 25% 25%,#fff 0 3%,transparent 4%),
        radial-gradient(circle at 70% 30%,#8d7cff 0 4%,transparent 5%),
        radial-gradient(circle at 40% 75%,#fff 0 3%,transparent 4%),
        radial-gradient(circle,#4829a8,#160d3b 65%,#080313);

    border:3px solid #6377ff;
    box-shadow:0 0 35px #4d5fff;
}

.name{
    margin-top:16px;
    font-size:30px;
    font-weight:900;
}

.subtitle{
    margin-top:7px;
    color:#8995aa;
    font-size:18px;
}

/* SEARCH */
.search{
    width:100%;
    padding:18px 20px;
    margin-bottom:15px;

    border-radius:18px;
    border:1px solid #35445c;

    background:#1b293b;
    color:white;

    font-size:17px;
    outline:none;
}

.search::placeholder{
    color:#8995aa;
}

/* CATEGORY */
.category{
    padding:18px 20px;
    margin-bottom:18px;

    border-radius:18px;
    border:1px solid #35445c;

    background:#1b293b;
    font-size:18px;
}

/* CARD */
.card{
    padding:22px;
    margin-bottom:18px;

    background:#1b293b;
    border:1px solid #35445c;
    border-radius:22px;
}

.card-top{
    display:flex;
    align-items:center;
    gap:18px;
}

.icon{
    width:82px;
    height:82px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#293c57;

    font-size:24px;
    font-weight:900;
}

.card h2{
    font-size:24px;
}

.card p{
    margin-top:7px;
    color:#8995aa;
    font-size:17px;
}

/* BUTTON */
.get{
    width:100%;
    margin-top:22px;
    padding:16px;

    border:0;
    border-radius:30px;

    background:#5366ff;
    color:white;

    font-size:18px;
    font-weight:bold;
}

.get:active{
    transform:scale(.98);
}

/* RESULT */
.result{
    display:none;

    margin-top:15px;
    padding:17px;

    border-radius:13px;

    background:#0e1825;
    border:1px solid #26364b;

    text-align:center;
}

.result-title{
    color:#9ca8bb;
    font-size:14px;
}

.key{
    margin-top:8px;
    color:#62ff9b;
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.copy{
    width:auto;
    margin-top:12px;
    padding:10px 22px;

    border:0;
    border-radius:9px;

    background:#26364b;
    color:white;

    font-size:14px;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#566174;
    font-size:13px;
    margin-top:30px;
}
</style>
</head>

<body>

    <!-- PROFILE -->
    <div class="profile">

        <div class="avatar">
            G
        </div>

        <div class="name">
            galaxy.
        </div>

        <div class="subtitle">
            KEY CENTER
        </div>

    </div>


    <!-- SEARCH -->
    <input
        id="search"
        class="search"
        type="text"
        placeholder="Tìm kiếm sản phẩm..."
        oninput="searchProducts()"
    >


    <!-- CATEGORY -->
    <div class="category">
        Tất cả games
    </div>
