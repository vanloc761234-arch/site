<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key miễn phí - Galaxy</title>
<style>
  body { background: #0e1117; color: #fff; font-family: Arial; margin: 0; }
  .header { display: flex; align-items: center; padding: 14px; background: #000; }
  .header h1 { font-size: 18px; margin: 0 0 0 12px; }
  .header span { color: #aaa; font-size: 14px; margin-left: 6px; }
  .container { padding: 14px; }
  .search, .filter { width: 100%; padding: 12px; margin-bottom: 12px; background: #1a1e26; border: 1px solid #2a2f3a; border-radius: 10px; color: #fff; }
  .card { background: #1a1e26; border: 1px solid #2a2f3a; border-radius: 12px; padding: 12px; display: flex; align-items: center; margin-bottom: 12px; }
  .card img { width: 56px; height: 56px; border-radius: 8px; }
  .badge { background: #00c853; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 50%; position: absolute; margin: -45px 0 0 40px; }
  .info { flex: 1; margin-left: 12px; }
  .btn { background: #3b5bff; border: none; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
  #page2 { display: none; }
</style>
</head>
<body>

<!-- TRANG 1 -->
<div id="page1">
  <div class="header">
    <span>←</span>
    <h1>Key miễn phí <span>- Galaxy</span></h1>
  </div>
  <div class="container">
    <input class="search" placeholder="Tìm kiếm sản phẩm...">
    <select class="filter"><option>Tất cả games</option></select>

    <div class="card">
      <div>
        <img src="https://upload.wikimedia.org/wikipedia/vi/9/9a/Free_Fire_MAX_logo.png">
        <div class="badge">1</div>
      </div>
      <div class="info"><b>Free Fire</b></div>
      <button class="btn" onclick="showPage2()">Tất Cả Menu</button>
    </div>
  </div>
</div>

<!-- TRANG 2 -->
<div id="page2">
  <div class="header">
    <span onclick="showPage1()" style="cursor:pointer">←</span>
    <h1>Free Fire <span>- Galaxy</span></h1>
  </div>
  <div class="container">
    <div class="card"><div class="info"><b>DVLXKAI</b></div><button class="btn">Nhận Key</button></div>
    <div class="card"><div class="info"><b>Zenny</b></div><button class="btn">Nhận Key</button></div>
  </div>
</div>

<script>
function showPage2(){ document.getElementById('page1').style.display='none'; document.getElementById('page2').style.display='block'; }
function showPage1(){ document.getElementById('page1').style.display='block'; document.getElementById('page2').style.display='none'; }
</script>
</body>
</html>
