<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1117;color:#fff;font-family:Arial,sans-serif}
.header{display:flex;align-items:center;padding:14px;background:#000}
.header h1{font-size:18px;margin:0 0 0 12px}
.header span{color:#aaa;font-size:14px}
.container{padding:14px}
.search,.filter{width:100%;padding:12px;margin-bottom:12px;background:#1a1e26;border:1px solid #2a2f3a;border-radius:10px;color:#fff}
.card{background:#1a1e26;border:1px solid #2a2f3a;border-radius:12px;padding:12px;display:flex;align-items:center;margin-bottom:12px}
.info{flex:1;margin-left:12px}
.btn{background:#3b5bff;border:0;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer}
#page2,#page3{display:none}
.page3-body{background:#f5f5f5;min-height:100vh;display:flex;justify-content:center;padding:20px;color:#000}
.box{background:#fff;border-radius:12px;width:100%;max-width:400px;box-shadow:0 2px 10px #0002;overflow:hidden}
.success{background:#e8f5e9;color:#2e7d32;padding:14px;font-weight:bold}
.content{padding:20px;text-align:center}
.hint{color:#666;font-size:14px;margin-bottom:12px}
.code-box{border:2px dashed #2e7d32;border-radius:10px;padding:18px;font-size:22px;font-weight:bold;color:#2e7d32;cursor:pointer;margin-bottom:20px;user-select:all}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.red{color:#d32f2f}
.btn-gray{width:100%;background:#757575;color:#fff;border:0;padding:14px;border-radius:8px;font-size:16px;margin-top:20px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:6px;display:none}
</style>
</head>

<body>

<div id="page1">
  <div class="header">
    <span>←</span>
    <h1>Key miễn phí - Galaxy</h1>
  </div>

  <div class="container">
    <input class="search" placeholder="Tìm kiếm sản phẩm...">

    <select class="filter">
      <option>Tất cả games</option>
    </select>

    <div class="card">
      <div class="info"><b>Sản phẩm Demo</b></div>
      <button class="btn" onclick="showPage2()">Nhận key</button>
    </div>
  </div>
</div>

<div id="page2">
  <div class="header">
    <span onclick="showPage1()" style="cursor:pointer">←</span>
    <h1>Galaxy - Demo</h1>
  </div>

  <div class="container">

    <div class="card">
      <div class="info"><b>DVLXKAI</b></div>
      <button class="btn" onclick="startLink4M('DVLXKAI')">
        Nhận
      </button>
    </div>

    <div class="card">
      <div class="info"><b>Zenny</b></div>
      <button class="btn" onclick="startLink4M('Zenny')">
        Nhận
      </button>
    </div>

  </div>
</div>

<div id="page3" class="page3-body">
  <div class="box">

    <div class="success">
      ✓ DEMO KEY GENERATED
    </div>

    <div class="content">

      <div class="hint">
        Bấm vào mã để copy:
      </div>

      <div class="code-box"
           id="codeText"
           onclick="copyCode()">
      </div>

      <div class="row">
        <span>Tool</span>
        <b id="toolName"></b>
      </div>

      <div class="row">
        <span>Thiết bị</span>
        <b>1 Máy</b>
      </div>

      <div class="row">
        <span>Thời hạn</span>
        <b class="red">24 Giờ</b>
      </div>

      <button class="btn-gray" onclick="showPage2()">
        Quay Lại
      </button>

    </div>
  </div>
</div>

<div id="toast" class="toast">
  Đã copy!
</div>

<script>

const LINK4M =
"https://link4m.org/MVYzDd";

const DEMO_KEYS = {

  DVLXKAI:[
    "DVL-DEMO-001",
    "DVL-DEMO-002",
    "DVL-DEMO-003"
  ],

  Zenny:[
    "ZEN-DEMO-001",
    "ZEN-DEMO-002",
    "ZEN-DEMO-003"
  ]

};

let usedKeys = JSON.parse(
  localStorage.getItem("galaxy_demo_used") || "[]"
);

let selectedTool = "";


/* Mở Link4M */

function startLink4M(tool){

  selectedTool = tool;

  localStorage.setItem(
    "galaxy_selected_tool",
    tool
  );

  window.location.href = LINK4M;
}


/* Hiện mã demo */

function getDemoKey(tool){

  const key = DEMO_KEYS[tool].find(
    item => !usedKeys.includes(item)
  );

  if(!key){
    alert("Demo đã hết mã.");
    return;
  }

  usedKeys.push(key);

  localStorage.setItem(
    "galaxy_demo_used",
    JSON.stringify(usedKeys)
  );

  document.getElementById("toolName").innerText = tool;
  document.getElementById("codeText").innerText = key;

  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "none";
  document.getElementById("page3").style.display = "flex";

  document.body.className = "page3-body";

  setTimeout(function(){
    showPage1();
  },60*60*1000);
}


/* Trang 1 */

function showPage1(){

  document.getElementById("page1").style.display = "block";
  document.getElementById("page2").style.display = "none";
  document.getElementById("page3").style.display = "none";

  document.body.className = "";
}


/* Trang 2 */

function showPage2(){

  document.getElementById("page1").style.display = "none";
  document.getElementById("page2").style.display = "block";
  document.getElementById("page3").style.display = "none";

  document.body.className = "";
}


/* Copy */

async function copyCode(){

  const code =
    document.getElementById("codeText").innerText;

  if(!code) return;

  try{

    await navigator.clipboard.writeText(code);

    const toast =
      document.getElementById("toast");

    toast.style.display = "block";

    setTimeout(function(){
      toast.style.display = "none";
    },1500);

  }catch(error){

    alert("Không thể copy tự động.");

  }
}

</script>

</body>
</html>
